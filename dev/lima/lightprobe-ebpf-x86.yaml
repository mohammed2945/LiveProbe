# LightProbe's initial native eBPF test target is Linux x86-64.
# On Apple Silicon this VM uses QEMU full-system emulation and will be slow.
vmType: qemu
arch: x86_64

images:
  - location: "https://cloud-images.ubuntu.com/releases/resolute/release-20260720/ubuntu-26.04-server-cloudimg-amd64.img"
    arch: x86_64
    digest: "sha256:117816726abbdefc5ef3e38902e81a76f1c76c3610e709999d0885f9d5d9b477"
    variant: server
  - location: "https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-amd64.img"
    arch: x86_64
    variant: server

cpus: 4
memory: 6GiB
disk: 60GiB

# Build and test only on the guest-native filesystem. Do not compile eBPF
# artifacts from a macOS-shared mount.
mounts: []
plain: true

containerd:
  system: false
  user: false
