[workspace]
members = ["protocol", "agent", "loader"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
gimli = "0.34.0"
hex = "0.4.3"
libbpf-rs = "0.26.2"
libc = "0.2.177"
nix = { version = "0.31.3", features = ["fs", "socket", "user"] }
object = { version = "0.39.1", features = ["read_core", "elf"] }
percent-encoding = "2.3.2"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.54", features = ["formatting"] }
ureq = { version = "3.3.0", features = ["json"] }
