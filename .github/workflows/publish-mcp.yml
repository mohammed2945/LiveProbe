name: Publish MCP package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Run from the workspace root rather than packages/mcp-server: the MCP
      # package now reaches the protocol package through the workspace and
      # cannot be built from its own directory alone.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter @doomslayer2945/liveprobe-mcp run build

      - name: Test package
        run: pnpm --filter @doomslayer2945/liveprobe-mcp run test

      # pnpm, never npm. `npm pack` and `npm publish` copy `workspace:*` into
      # the published manifest verbatim, and every install of that tarball then
      # fails with EUNSUPPORTEDPROTOCOL. Only pnpm resolves the workspace
      # protocol to a real version. The grep makes that failure impossible to
      # publish rather than merely unlikely.
      - name: Inspect publish contents
        run: |
          pnpm --filter @doomslayer2945/liveprobe-protocol pack --pack-destination /tmp
          pnpm --filter @doomslayer2945/liveprobe-mcp pack --pack-destination /tmp
          tar -xzOf /tmp/doomslayer2945-liveprobe-mcp-*.tgz package/package.json \
            > /tmp/mcp-manifest.json
          cat /tmp/mcp-manifest.json
          if grep -q '"workspace:' /tmp/mcp-manifest.json; then
            echo "::error::published manifest still contains a workspace: specifier"
            exit 1
          fi

          # --provenance makes npm verify that the manifest's repository.url
          # matches the repository the workflow signed from, and it rejects the
          # upload with a 422 when the field is missing. That happens after the
          # tarball is uploaded, so without this check a release fails halfway
          # through and can leave the protocol package published while the MCP
          # package that depends on it is not.
          expected_repository="https://github.com/${GITHUB_REPOSITORY}.git"
          for tarball in /tmp/doomslayer2945-liveprobe-protocol-*.tgz \
            /tmp/doomslayer2945-liveprobe-mcp-*.tgz; do
            manifest="$(tar -xzOf "$tarball" package/package.json)"
            actual_repository="$(
              node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));
                process.stdout.write(m.repository?.url ?? "")' <<<"$manifest"
            )"
            if [[ "$actual_repository" != "$expected_repository" ]]; then
              echo "::error::${tarball} declares repository.url \
'${actual_repository}', expected '${expected_repository}' for provenance"
              exit 1
            fi
          done

      # The protocol package must exist on the registry before the MCP package
      # that declares a hard dependency on it. Skipped when that exact version
      # is already published, so re-running this workflow stays safe.
      - name: Publish protocol to npm
        if: ${{ !inputs.dry_run }}
        run: |
          version="$(node -p "require('./packages/protocol/package.json').version")"
          if npm view "@doomslayer2945/liveprobe-protocol@${version}" version >/dev/null 2>&1; then
            echo "@doomslayer2945/liveprobe-protocol@${version} is already published"
          else
            pnpm --filter @doomslayer2945/liveprobe-protocol publish \
              --access public --provenance --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish MCP to npm
        if: ${{ !inputs.dry_run }}
        run: |
          pnpm --filter @doomslayer2945/liveprobe-mcp publish \
            --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
