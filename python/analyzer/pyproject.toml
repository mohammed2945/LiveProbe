[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "liveprobe-analysis"
version = "0.1.0"
description = "Operator-side Python data-flow analysis for LiveProbe"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "LiveProbe contributors" }]
dependencies = []

[project.scripts]
liveprobe-analysis = "liveprobe_analysis.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
pythonpath = ["src"]
testpaths = ["tests"]
